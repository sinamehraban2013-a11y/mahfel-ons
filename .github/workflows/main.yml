name: Build Mahfel Ons APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Project and Build APK
        run: |
          mkdir -p /tmp/src
          cp pubspec.yaml main.dart logo.png /tmp/src/ 2>/dev/null || true
          
          # ساخت یک پروژه خام فلاتر
          flutter create mahfel_build --org ir.shiravi --project-name mahfel_ons --platforms=android
          cd mahfel_build
          
          # انتقال کدهای اصلی و تنظیمات
          cp /tmp/src/pubspec.yaml ./pubspec.yaml
          mkdir -p assets
          cp /tmp/src/logo.png assets/logo.png 2>/dev/null || true
          cp /tmp/src/main.dart lib/main.dart
          
          # قرار دادن مانیفست صحیح و استاندارد اندروید با مجوز اینترنت
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="محفل اُنس"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfel-Ons-App
          path: mahfel_build/build/app/outputs/flutter-apk/app-release.apk
