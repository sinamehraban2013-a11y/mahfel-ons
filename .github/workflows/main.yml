name: Build Mahfel Ons APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter project
        run: |
          flutter create app_build \
            --org ir.shiravi \
            --project-name mahfel_ons \
            --platforms=android

      - name: Copy application files
        run: |
          set -e

          if [ -f "pubspec.yaml" ]; then
            cp "pubspec.yaml" "app_build/pubspec.yaml"
          elif [ -f "mahfel_ons/pubspec.yaml" ]; then
            cp "mahfel_ons/pubspec.yaml" "app_build/pubspec.yaml"
          else
            echo "pubspec.yaml not found"
            exit 1
          fi

          if [ -f "main.dart" ]; then
            cp "main.dart" "app_build/lib/main.dart"
          elif [ -f "mahfel_ons/lib/main.dart" ]; then
            cp "mahfel_ons/lib/main.dart" "app_build/lib/main.dart"
          else
            echo "main.dart not found"
            exit 1
          fi

          mkdir -p app_build/assets

          if [ -f "logo.png" ]; then
            cp "logo.png" "app_build/assets/logo.png"
          elif [ -f "assets/logo.png" ]; then
            cp "assets/logo.png" "app_build/assets/logo.png"
          elif [ -f "mahfel_ons/assets/logo.png" ]; then
            cp "mahfel_ons/assets/logo.png" "app_build/assets/logo.png"
          else
            echo "logo.png not found"
            exit 1
          fi

      - name: Add Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "app_build/android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          permission = (
              '    <uses-permission '
              'android:name="android.permission.INTERNET"/>\n'
          )

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<manifest",
                  "<manifest",
                  1
              )
              position = text.find(">")
              text = text[:position + 1] + "\n" + permission + text[position + 1:]

          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        working-directory: app_build
        run: |
          flutter pub get

      - name: Build release APK
        working-directory: app_build
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfel-Ons-App
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
