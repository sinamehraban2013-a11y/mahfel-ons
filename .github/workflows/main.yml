name: Build Mahfel Ons APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Project
        run: |
          # 1. Create a clean standard Flutter project
          flutter create app_build --org ir.shiravi --project-name mahfel_ons --platforms=android
          cd app_build

          # 2. Copy app source files from repo root
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../main.dart lib/main.dart
          mkdir -p assets
          cp ../logo.png assets/logo.png

          # 3. Add INTERNET permission to the default AndroidManifest
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          # 4. Fetch packages and build the release APK
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfel-Ons-App
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
