name: Build Mahfel Ons APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project Structure
        run: |
          mkdir temp_src
          cp pubspec.yaml main.dart logo.png temp_src/ || true
          flutter create . --org ir.shiravi --project-name mahfelons --empty --platforms=android
          cp temp_src/pubspec.yaml .
          mkdir -p lib assets
          cp temp_src/main.dart lib/main.dart
          cp temp_src/logo.png assets/logo.png
          sed -i '/<application/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfel-Ons-App
          path: build/app/outputs/flutter-apk/app-release.apk
