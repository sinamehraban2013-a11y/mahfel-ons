name: Build Mahfel Ons APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create app_build --org ir.shiravi --project-name mahfel_ons --platforms=android

      - name: Copy Project Files
        run: |
          cd app_build
          cp ../pubspec.yaml pubspec.yaml
          cp ../main.dart lib/main.dart
          mkdir -p assets
          if [ -f ../logo.png ]; then cp ../logo.png assets/logo.png; else cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png assets/logo.png; fi
          cp ../AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: cd app_build && flutter pub get

      - name: Build APK
        run: cd app_build && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfel-Ons-App
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
