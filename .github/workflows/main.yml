name: Build Mahfel Ons APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Project
        run: |
          # ۱. ساخت پروژه تمیز با ساختار استاندارد فلاتر
          تمیز با ساختار استاندارد فلاتر
          mahfel_ons --platforms=android
          cd app_build

          # ۲. جایگزینی کدهای برنامه (فایل‌ها در ریشه مخزن هستند)
          cp ../pubspec.yaml ./pubspec.yaml
          cp ../main.dart lib/main.dart
          mkdir -p assets
          cp ../logo.png assets/logo.png

          # ۳. اضافه کردن مجوز اینترنت به مانیفست پیش‌فرض
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          # ۴. دانلود پکیج‌ها و ساخت نهایی APK
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfel-Ons-App
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
