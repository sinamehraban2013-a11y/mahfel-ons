name: Build Mahfel Ons APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Organize Flutter Project Structure
        run: |
          mkdir -p lib assets
          if [ -f main.dart ]; then mv main.dart lib/; fi
          if [ -f logo.png ]; then mv logo.png assets/; fi
          flutter create . --org ir.shiravi --project-name mahfelons --platforms=android

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfel-Ons-App
          path: build/app/outputs/flutter-apk/app-release.apk
